[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobradar-bw"
version = "0.1.0"
description = "Privater Stellenradar fuer Assistenz- und Stabsrollen in Baden-Wuerttemberg"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Jobradar BW" }]
dependencies = [
  "alembic==1.18.5",
  "bleach==6.4.0",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.14.2",
  "pypdf==6.14.2",
  "python-docx==1.2.0",
  "python-dotenv==1.2.2",
  "python-multipart==0.0.32",
  "rapidfuzz==3.14.5",
  "sqlalchemy==2.0.51",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "ruff==0.15.7",
]

[project.scripts]
jobradar = "jobradar.cli:main"
jobradar-worker = "jobradar.worker:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobradar = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
